<app-people></app-people>

<div id="parameters" (change)="configChanged()">
    <div>
        <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Starting date</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="startingDate" (dateInput)="configChanged()">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field class="example-full-width">
            <input matInput type="number" min="5" max="365" placeholder="Number of days to schedule"
                [(ngModel)]="numberOfDays">
        </mat-form-field>
    </div>
</div>

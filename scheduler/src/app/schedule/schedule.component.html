<p>Iteration count {{iterationsTaken}}</p>
<p>Score {{solution?.cost}} </p>
<p>First problem at {{solution?.fitness?.firstProblem}}</p>
<p>Problem count {{solution?.problemCount}} </p>

<table mat-table [dataSource]="results" class="mat-elevation-z8">

    <ng-container matColumnDef="weekday">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let result"> {{result.date.toFormat('EEEE')}} </td>
    </ng-container>

    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let result"> {{result.date.toFormat('MM/dd/yyyy')}} </td>
    </ng-container>

    <ng-container matColumnDef="shift">
        <th mat-header-cell *matHeaderCellDef>Shift</th>
        <td mat-cell *matCellDef="let result"> {{result.shift}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let result"> {{result.person.name}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr class="{{ row.problem ? 'problem' : '' }}" mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

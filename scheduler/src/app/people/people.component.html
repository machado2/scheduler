<mat-card>
    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <th mat-footer-cell *matFooterCellDef>
                <mat-form-field>
                    <input matInput placeholder="Name of person to add">
                </mat-form-field>
            </th>
            <td mat-cell *matCellDef="let person"> {{person.name}}</td>
        </ng-container>
        <ng-container matColumnDef="removebutton">
            <th mat-header-cell *matHeaderCellDef></th>
            <th mat-footer-cell *matFooterCellDef>
                <button mat-icon-button aria-label="Add person" (click)="addPerson()">
                    <mat-icon>add</mat-icon>
                </button>
            </th>
            <td mat-cell *matCellDef="let person">
                <button mat-icon-button aria-label="Remove person" (click)="removePerson(person)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
</mat-card>
